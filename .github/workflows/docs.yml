# Build and deploy the VitePress docs site to GitHub Pages.
# Replaces the previous Jekyll workflow, which built from
# src/0/3/6/9/1/2/4/8/7/5/1/ and served that folder verbatim.
name: Deploy VitePress docs to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel a run already publishing.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify published projections are current
        # Only the checks that bear on what this job PUBLISHES: the generated
        # census/receipt pages and the README spectrum block. The full gate
        # (kernel smoke, ambient-Math ban, bundle/skills seals, ratchet,
        # mcp smoke) already runs in CI on two Node versions — repeating it
        # here paid ~15s of ratchet a third time to re-prove something that
        # cannot affect the built site. Still fails closed on stale docs.
        run: npm run verify:docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
