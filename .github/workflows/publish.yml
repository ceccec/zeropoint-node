# Publish to npm — automation, not a hand ritual.
#
# Triggers: version tag (v*), GitHub Release published, or workflow_dispatch.
# Fail-closed: `npm run check` must pass before publish.
#
# Auth (prefer trusted publishing):
#   1. npmjs.com → package → Settings → Trusted Publisher
#      GitHub org/user: ceccec  ·  repo: zeropoint-node  ·  workflow: publish.yml
#   2. Optional fallback: repo secret NPM_TOKEN (classic automation token)
#      → NODE_AUTH_TOKEN. Prefer OIDC; long-lived tokens are last resort.
#
# Provenance: CLI `--provenance` here only (needs GitHub Actions OIDC).
# Do NOT set publishConfig.provenance in package.json — that breaks local `npm publish`.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create a release for (e.g. v1.3.3)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so version:check inside `npm run check` can
          # actually run its tag gates — a shallow checkout has no tags, so
          # the "never publish below an existing release" gate would skip
          # at the one moment it matters.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm ≥ 11.5.1
      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The repository's own predicates gate the release. Not part of `npm run
      # check`: ordinary commits must stay green while a criterion is unmet,
      # which is the point of writing one that returns false. What must not
      # happen is publishing a version while the repo's own measures say the
      # thing it is named for has not arrived. Override deliberately with
      # `node scripts/criteria-check.mjs --override="reason"` and put the
      # reason in the release notes.
      - name: Criteria — the repository's own predicates
        run: npm run criteria:check

      - name: Fail-closed check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Skip if version already on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          echo "package=${NAME}@${VER}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VER} already published — skip"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          # Optional classic fallback when trusted publisher is not configured yet
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A release is exactly when the deprecation table should be reconciled:
      # the version that supersedes the old ones has just gone out.
      #
      # This also isolates a question registry-sync.yml cannot answer. The
      # trusted publisher is bound to THIS workflow file, so an OIDC write from
      # any other workflow is rejected on identity alone — a 404 there proves
      # nothing about whether trusted publishing covers `npm deprecate`. Run
      # from here, the identity is right, so the result is about scope.
      #
      # continue-on-error: a failed reconcile must never fail a publish that
      # already succeeded.
      - name: Reconcile npm deprecations
        id: deprecations
        continue-on-error: true
        run: |
          set +e
          npm run registry:apply 2>&1 | tee /tmp/dep.log
          code=${PIPESTATUS[0]}
          if [ "${code}" = "0" ]; then verdict=applied
          elif grep -q 'EOTP' /tmp/dep.log; then verdict=needs-otp
          elif grep -qE 'E404|E403|E401|ENEEDAUTH' /tmp/dep.log; then verdict=not-authorised
          else verdict=other; fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "::notice::trusted-publishing deprecate from publish.yml: ${verdict} (exit ${code})"
          exit 0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecation reconcile result
        run: |
          echo "verdict: ${{ steps.deprecations.outputs.verdict }}"
          if [ "${{ steps.deprecations.outputs.verdict }}" != "applied" ]; then
            echo "::warning::Deprecations declared in npm-deprecations.json are not live. See registry-sync.yml."
          fi

  # ——— the GitHub Release, formerly .github/workflows/release.yml ———
  #
  # Merged here because on a tag push both workflows fired at once: three
  # checkouts, three Node setups, two `npm ci`, and a job whose entire purpose
  # was to poll npm until the OTHER workflow had finished publishing. That poll
  # was a workaround for the two being separate. One workflow makes it an edge.
  release:
    runs-on: ubuntu-latest
    # The await-npm job this used to depend on polled npm for up to ten
    # minutes, because publish and release were separate workflows that started
    # together and raced. In one workflow the ordering is a dependency edge, so
    # there is nothing to wait for: if publish did not succeed, this does not
    # run, and if it did, the version is on npm by definition.
    needs: [publish]
    # Only for a tag push or an explicit dispatch. publish.yml also triggers on
    # `release: published`, and without this the release job would try to
    # announce a release that had just been created by itself.
    # On a `release: published` event github.ref is ALSO the tag ref, so
    # without excluding that event this job would fire on the release it had
    # just created and re-announce it. `gh release edit` makes that an update
    # rather than a loop, but a workflow that reacts to its own output is a
    # loop waiting for someone to change one line.
    if: >-
      github.event_name != 'release' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # Creating a release writes; the publish job above keeps contents: read.
    # Per-job permissions rather than granting write to the whole workflow.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # Fail-closed: no notes, no release.
      - name: Extract release notes from CHANGELOG
        run: |
          node scripts/release-notes.mjs --check "${{ steps.v.outputs.version }}"
          {
            node scripts/release-notes.mjs "${{ steps.v.outputs.version }}"
            echo
            echo "---"
            echo
            echo "Published to npm as [\`zeropoint-node@${{ steps.v.outputs.version }}\`](https://www.npmjs.com/package/zeropoint-node/v/${{ steps.v.outputs.version }}) with build provenance."
          } > /tmp/notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} exists — updating its notes"
            gh release edit "$TAG" --notes-file /tmp/notes.md --title "$TAG"
          else
            gh release create "$TAG" --notes-file /tmp/notes.md --title "$TAG" --verify-tag
          fi
          gh release view "$TAG" --json url,name --jq '"created: " + .url'
