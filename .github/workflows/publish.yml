# Publish to npm — automation, not a hand ritual.
#
# Triggers: version tag (v*), GitHub Release published, or workflow_dispatch.
# Fail-closed: `npm run check` must pass before publish.
#
# Auth (prefer trusted publishing):
#   1. npmjs.com → package → Settings → Trusted Publisher
#      GitHub org/user: ceccec  ·  repo: zeropoint-node  ·  workflow: publish.yml
#   2. Optional fallback: repo secret NPM_TOKEN (classic automation token)
#      → NODE_AUTH_TOKEN. Prefer OIDC; long-lived tokens are last resort.
#
# Provenance: CLI `--provenance` here only (needs GitHub Actions OIDC).
# Do NOT set publishConfig.provenance in package.json — that breaks local `npm publish`.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm ≥ 11.5.1
      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Skip if version already on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          echo "package=${NAME}@${VER}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VER} already published — skip"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          # Optional classic fallback when trusted publisher is not configured yet
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
