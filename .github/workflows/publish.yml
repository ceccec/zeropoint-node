# Publish to npm — automation, not a hand ritual.
#
# Triggers: version tag (v*), GitHub Release published, or workflow_dispatch.
# Fail-closed: `npm run check` must pass before publish.
#
# Auth (prefer trusted publishing):
#   1. npmjs.com → package → Settings → Trusted Publisher
#      GitHub org/user: ceccec  ·  repo: zeropoint-node  ·  workflow: publish.yml
#   2. Optional fallback: repo secret NPM_TOKEN (classic automation token)
#      → NODE_AUTH_TOKEN. Prefer OIDC; long-lived tokens are last resort.
#
# Provenance: CLI `--provenance` here only (needs GitHub Actions OIDC).
# Do NOT set publishConfig.provenance in package.json — that breaks local `npm publish`.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so version:check inside `npm run check` can
          # actually run its tag gates — a shallow checkout has no tags, so
          # the "never publish below an existing release" gate would skip
          # at the one moment it matters.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm ≥ 11.5.1
      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The repository's own predicates gate the release. Not part of `npm run
      # check`: ordinary commits must stay green while a criterion is unmet,
      # which is the point of writing one that returns false. What must not
      # happen is publishing a version while the repo's own measures say the
      # thing it is named for has not arrived. Override deliberately with
      # `node scripts/criteria-check.mjs --override="reason"` and put the
      # reason in the release notes.
      - name: Criteria — the repository's own predicates
        run: npm run criteria:check

      - name: Fail-closed check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Skip if version already on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          echo "package=${NAME}@${VER}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VER} already published — skip"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          # Optional classic fallback when trusted publisher is not configured yet
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A release is exactly when the deprecation table should be reconciled:
      # the version that supersedes the old ones has just gone out.
      #
      # This also isolates a question registry-sync.yml cannot answer. The
      # trusted publisher is bound to THIS workflow file, so an OIDC write from
      # any other workflow is rejected on identity alone — a 404 there proves
      # nothing about whether trusted publishing covers `npm deprecate`. Run
      # from here, the identity is right, so the result is about scope.
      #
      # continue-on-error: a failed reconcile must never fail a publish that
      # already succeeded.
      - name: Reconcile npm deprecations
        id: deprecations
        continue-on-error: true
        run: |
          set +e
          npm run registry:apply 2>&1 | tee /tmp/dep.log
          code=${PIPESTATUS[0]}
          if [ "${code}" = "0" ]; then verdict=applied
          elif grep -q 'EOTP' /tmp/dep.log; then verdict=needs-otp
          elif grep -qE 'E404|E403|E401|ENEEDAUTH' /tmp/dep.log; then verdict=not-authorised
          else verdict=other; fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "::notice::trusted-publishing deprecate from publish.yml: ${verdict} (exit ${code})"
          exit 0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecation reconcile result
        run: |
          echo "verdict: ${{ steps.deprecations.outputs.verdict }}"
          if [ "${{ steps.deprecations.outputs.verdict }}" != "applied" ]; then
            echo "::warning::Deprecations declared in npm-deprecations.json are not live. See registry-sync.yml."
          fi
