<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Triple Merkaba 3D Animation</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      margin: 0;
      padding: 20px;
      line-height: 1.4;
      overflow: hidden;
    }
    
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #0f0;
      max-width: 400px;
    }
    
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #0f0;
    }
    
    button {
      background: #333;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 3px;
      font-family: inherit;
      margin: 2px;
    }
    
    button:hover {
      background: #0f0;
      color: #000;
    }
    
    .info {
      font-size: 12px;
      margin-bottom: 10px;
    }
    
    .status {
      font-size: 11px;
      color: #0ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="canvas3d"></canvas>

      </div>
      <div class="status" id="status">
        Loading 3D scene...
      </div>
    </div>
    
    <div class="controls">
      <button onclick="toggleAnimation()">Play/Pause</button>
      <button onclick="resetAnimation()">Reset</button>
      <button onclick="toggleWireframe()">Wireframe</button>
      <button onclick="toggleLabels()">Labels</button>
    </div>
  </div>
