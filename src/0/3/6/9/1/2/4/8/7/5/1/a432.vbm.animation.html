<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A432 VBM Multidimensional Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Arial', sans-serif;
    }
    
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }
    
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 100;
    }
    
    button {
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 5px 10px;
      margin: 2px;
      border-radius: 3px;
      cursor: pointer;
    }
    
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="info">
    <h3>A432 VBM Animation</h3>
    <p>Sequence: [0, 3, 6, 9, 1, 2, 4, 8, 7, 5, 1]</p>
    <p>Trinity Axis: [3, 6, 9]</p>
    <p>Rodin Sequence: [1, 2, 4, 8, 7, 5, 1]</p>
    <p>Base Frequency: 432 Hz</p>
  </div>
  
  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Wave 26: vendor CDN script dissolved — module uses local a432.vbm.animation.ts only -->
  <script type="module">
    // Import the harmonized VBM animation module
    import { createVBMAnimation, VBM_ANIMATION_CONSTANTS, VBM_ANIMATION_DOC } from './a432.vbm.animation.ts';
    
    // Create the animation controller
    let vbmController = createVBMAnimation();
    
    // Get the renderer and append to DOM
    const renderer = vbmController.getRenderer();
    document.body.appendChild(renderer.domElement);
    
    // Control buttons
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    startBtn.addEventListener('click', () => {
      vbmController.start();
      console.log('VBM Animation started');
      console.log('Sequence:', vbmController.getSequence());
      console.log('Constants:', VBM_ANIMATION_CONSTANTS);
      console.log('Documentation:', VBM_ANIMATION_DOC);
    });
    
    stopBtn.addEventListener('click', () => {
      vbmController.stop();
      console.log('VBM Animation stopped');
    });
    
    resetBtn.addEventListener('click', () => {
      vbmController.stop();
      // Recreate the controller for a fresh start
      const newController = createVBMAnimation();
      document.body.replaceChild(newController.getRenderer().domElement, renderer.domElement);
      vbmController = newController;
      console.log('VBM Animation reset');
    });
    
    // Auto-start the animation
    vbmController.start();
    
    // Log the A432 system information
    console.log('A432 VBM Animation System:');
    console.log('Purpose:', VBM_ANIMATION_DOC.purpose);
    console.log('Sequence:', VBM_ANIMATION_DOC.sequence);
    console.log('Trinity:', VBM_ANIMATION_DOC.trinity);
    console.log('Rodin:', VBM_ANIMATION_DOC.rodin);
    console.log('Torus:', VBM_ANIMATION_DOC.torus);
    console.log('Animation:', VBM_ANIMATION_DOC.animation);
    console.log('Color:', VBM_ANIMATION_DOC.color);
    console.log('Frequency:', VBM_ANIMATION_DOC.frequency);
  </script>
</body>
</html>
